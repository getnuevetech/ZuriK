version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: african_fashion_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-african_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-african_pass}
      POSTGRES_DB: ${DB_NAME:-african_fashion}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-african_user} -d ${DB_NAME:-african_fashion}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: african_fashion_api
    restart: unless-stopped
    env_file: .env
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-african_user}:${DB_PASSWORD:-african_pass}@postgres:5432/${DB_NAME:-african_fashion}
      PORT: 3001
      NODE_ENV: development

volumes:
  postgres_data:
