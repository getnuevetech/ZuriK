version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: african-fashion-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: africanfashion
      POSTGRES_PASSWORD: africanfashion123
      POSTGRES_DB: african_fashion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U africanfashion"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - african-fashion-dev

  # Backend API (Development Mode)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: builder
    container_name: african-fashion-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: africanfashion
      DB_PASSWORD: africanfashion123
      DB_NAME: african_fashion_db
      DB_SYNCHRONIZE: true
      
      # App
      NODE_ENV: development
      PORT: 3001
      API_PREFIX: api
      
      # CORS
      CORS_ORIGIN: http://localhost:3000
      
      # JWT
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: dev-refresh-secret-key-change-in-production
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/uploads:/app/uploads
    command: npm run start:dev
    networks:
      - african-fashion-dev

  # Frontend (Development Mode)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: deps
    container_name: african-fashion-frontend-dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-nextauth-secret-change-in-production
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/public:/app/apps/frontend/public
    command: npm run dev
    networks:
      - african-fashion-dev

networks:
  african-fashion-dev:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
